<title>Coco Island 3D</title>
<meta name="description" content="ブラウザで遊べる3Dアクションゲーム。ステージ1-1と1-2を越えて、ボスのキングマッシュを倒そう。">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, HUD chips pinned to the top corners, boss bar centered under them, a centered card for title / result screens, touch pad on phones */
:root {
  --sky: #8fd3ff;
  --ink: #1d2a44;
  --sun: #ffc93c;
  --leaf: #3fa34d;
  --coral: #ff6b5a;
  --paper: #fffaf0;
  --teal: #1fb5a8;
  --plum: #7b2d8b;
  --display: "Bungee", "Arial Black", system-ui, sans-serif;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--body); }
#game { position: fixed; inset: 0; }
#game canvas { display: block; touch-action: none; }
[hidden] { display: none !important; }

.hud {
  position: fixed; left: 16px; right: 16px;
  top: calc(12px + env(safe-area-inset-top, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none; user-select: none;
}
.hud-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px;
  padding: 4px 12px; box-shadow: 0 4px 0 var(--ink);
  font-family: var(--display); font-size: 18px; line-height: 1.4;
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
}
.chip.stage { background: var(--ink); color: var(--sun); }
.coin-ico { width: 16px; height: 20px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); box-sizing: border-box; }
.hearts { color: var(--coral); letter-spacing: 2px; }
.hearts .lost { color: color-mix(in srgb, var(--ink) 25%, var(--paper)); }
.star-ico { color: var(--sun); -webkit-text-stroke: 1.5px var(--ink); }

.bossbar {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(70px + env(safe-area-inset-top, 0px));
  width: min(360px, calc(100% - 32px)); box-sizing: border-box;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
  padding: 6px 10px 8px; pointer-events: none; display: flex; flex-direction: column; gap: 4px;
}
.bossbar .name { font-family: var(--display); font-size: 14px; color: var(--plum); display: flex; justify-content: space-between; gap: 8px; }
.bossbar .name small { font-family: var(--body); font-weight: 800; font-size: 12px; color: var(--coral); }
.pips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.pip { height: 12px; border-radius: 4px; border: 2px solid var(--ink); background: var(--plum); }
.pip.empty { background: color-mix(in srgb, var(--ink) 15%, var(--paper)); }

.toast {
  position: fixed; left: 50%; top: 24%; transform: translate(-50%, 0);
  font-family: var(--display); font-size: clamp(22px, 6vw, 44px); color: var(--paper);
  -webkit-text-stroke: 2px var(--ink); text-shadow: 0 5px 0 var(--ink);
  pointer-events: none; white-space: nowrap; transition: opacity .3s, transform .3s;
}
.toast.off { opacity: 0; transform: translate(-50%, -12px); }

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: 16px; box-sizing: border-box;
  background: color-mix(in srgb, var(--ink) 35%, transparent);
}
.card {
  width: min(460px, 100%); box-sizing: border-box;
  background: var(--paper); color: var(--ink);
  border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 24px 22px; display: flex; flex-direction: column; gap: 14px;
  max-height: calc(100% - 24px); overflow-y: auto;
}
.card h1 {
  margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 48px); line-height: 1;
  color: var(--sun); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 5px 0 var(--ink); text-wrap: balance;
}
.card .sub { margin: 0; font-weight: 800; font-size: 15px; letter-spacing: .08em; color: var(--teal); }
.card p { margin: 0; line-height: 1.7; font-size: 15px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; align-items: center; margin: 0; }
.keys dt, .keys dd { margin: 0; }
kbd {
  font-family: var(--body); font-weight: 800; font-size: 12px;
  background: var(--paper); border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 6px; padding: 1px 6px; white-space: nowrap;
}
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stats .chip { box-shadow: 0 3px 0 var(--ink); font-size: 16px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 160px; }
.btn {
  font-family: var(--display); font-size: 20px; color: var(--ink);
  background: var(--sun); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
  padding: 10px 14px; cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn.alt { background: var(--paper); }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.btn:disabled { cursor: not-allowed; opacity: .55; font-size: 14px; font-family: var(--body); font-weight: 800; }
.touch-only { display: none; }

/* Touch pad */
.pad { display: none; }
@media (pointer: coarse) {
  .pad { display: block; }
  .touch-only { display: grid; }
  .desk-only { display: none; }
}
.stick {
  position: fixed; left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 130px; height: 130px; border-radius: 50%;
  background: color-mix(in srgb, var(--paper) 35%, transparent); border: 3px solid color-mix(in srgb, var(--ink) 60%, transparent);
  touch-action: none;
}
.knob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--ink);
}
.pbtn {
  position: fixed; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  font-family: var(--display); color: var(--ink); display: grid; place-items: center; touch-action: none; user-select: none;
}
.pbtn.a { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; background: var(--sun); font-size: 26px; }
.pbtn.b { right: calc(118px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; background: var(--coral); font-size: 20px; }
.pbtn.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .toast, .btn { transition: none; }
}
@media (max-width: 480px) {
  .chip { font-size: 14px; padding: 3px 8px; border-radius: 10px; }
  .bossbar { top: calc(96px + env(safe-area-inset-top, 0px)); }
}
</style>

<div id="game"></div>

  <div class="hud-group">

<template id="titleTpl">
  <h1>COCO ISLAND</h1>
  <p class="sub">ココ島アドベンチャー 3D</p>
  <p><strong>1-1</strong> で島のてっぺんのスターを取り、<strong>1-2</strong> の火山とりでの奥にいるボス<strong>キングマッシュ</strong>を倒そう。</p>
  <dl class="keys desk-only">

  <dl class="keys touch-only">

    <dt><kbd>A</kbd></dt><dd>ジャンプ（続けて押すと三段ジャンプ）</dd>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Renderer / scene ----------
const host = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe6ff, 70, 190);
function skyTex(top, low) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, low); g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  return new THREE.CanvasTexture(c);
}

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const hemi = new THREE.HemisphereLight(0xffffff, 0x7a9a5a, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// ---------- Textures & materials ----------
function canvasTex(draw, size = 64) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter;
  return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function bricks(g, s, base, line) {
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  g.fillStyle = line;
  const h = s / 4;
  for (let r = 0; r < 4; r++) {
    g.fillRect(0, r * h, s, 3);
    const off = r % 2 ? s / 4 : 0;
    for (let x = off; x < s + 1; x += s / 2) g.fillRect(x % s, r * h, 3, h);
  }
}
const grassTex = canvasTex((g, s) => {
  g.fillStyle = '#62c35c'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#55b24f'; g.fillRect(0, 0, s / 2, s / 2); g.fillRect(s / 2, s / 2, s / 2, s / 2);
});
const dirtTex = canvasTex((g, s) => {
  g.fillStyle = '#c4834a'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#ad6f3a'; for (let i = 0; i < 14; i++) g.fillRect(rnd() * s | 0, rnd() * s | 0, 6, 4);
  g.fillStyle = '#d99a5e'; for (let i = 0; i < 8; i++) g.fillRect(rnd() * s | 0, rnd() * s | 0, 4, 3);
});
const brickTex = canvasTex((g, s) => bricks(g, s, '#d0703c', '#7a3b1c'));
const castleTex = canvasTex((g, s) => bricks(g, s, '#8d8a9e', '#4b4760'));
const castleTopTex = canvasTex((g, s) => {
  g.fillStyle = '#a7a3b8'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#9792aa'; g.fillRect(0, 0, s / 2, s / 2); g.fillRect(s / 2, s / 2, s / 2, s / 2);
  g.fillStyle = '#4b4760'; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s);
});
function blockFace(fill, edge, mark) {
  return canvasTex((g, s) => {
    g.fillStyle = fill; g.fillRect(0, 0, s, s);
    g.strokeStyle = edge; g.lineWidth = 4; g.strokeRect(2, 2, s - 4, s - 4);
    g.fillStyle = edge; [[8, 8], [s - 10, 8], [8, s - 10], [s - 10, s - 10]].forEach(([x, y]) => g.fillRect(x, y, 3, 3));
    if (mark) {
      g.fillStyle = '#fffaf0'; g.font = 'bold 40px Arial Black, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.strokeStyle = edge; g.lineWidth = 5; g.strokeText(mark, s / 2, s / 2 + 3); g.fillText(mark, s / 2, s / 2 + 3);
    }
  });
}
const qTex = blockFace('#ffc93c', '#1d2a44', '?');
const usedTex = blockFace('#9b6a3e', '#5a3a1e');
const woodTex = canvasTex((g, s) => {
  g.fillStyle = '#ff9f43'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#e57f22'; for (let y = 0; y < s; y += 16) g.fillRect(0, y, s, 3);
  g.fillStyle = '#1d2a44'; g.fillRect(6, 6, 4, 4); g.fillRect(s - 10, 6, 4, 4);
});
const springTex = canvasTex((g, s) => {
  g.fillStyle = '#ff6b5a'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#fffaf0'; for (let y = 0; y < s; y += 16) g.fillRect(0, y, s, 7);
});
const dossunTex = canvasTex((g, s) => {
  g.fillStyle = '#9aa3b5'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#6b7388'; for (let i = 0; i < 10; i++) g.fillRect(rnd() * s | 0, rnd() * s | 0, 5, 5);
  g.strokeStyle = '#1d2a44'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, s - 3, s - 3);
  g.fillStyle = '#fffaf0'; g.fillRect(14, 22, 12, 10); g.fillRect(38, 22, 12, 10);
  g.fillStyle = '#1d2a44'; g.fillRect(19, 25, 5, 6); g.fillRect(40, 25, 5, 6);
  g.beginPath(); g.moveTo(12, 20); g.lineTo(28, 24); g.lineTo(28, 20); g.fill();
  g.beginPath(); g.moveTo(52, 20); g.lineTo(36, 24); g.lineTo(36, 20); g.fill();
  g.fillRect(18, 42, 28, 6);
  g.fillStyle = '#fffaf0'; for (let x = 20; x < 46; x += 6) g.fillRect(x, 43, 3, 4);
}, 64);
dossunTex.magFilter = THREE.LinearFilter;

const std = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75, metalness: 0 }, o));
const MAT = {
  ground: std({ map: dirtTex }),
  grass: std({ map: grassTex }),
  castle: std({ map: castleTex }),
  castleTop: std({ map: castleTopTex }),
  brick: std({ map: brickTex }),
  q: std({ map: qTex, emissive: 0x332200 }),
  used: std({ map: usedTex }),
  plat: std({ map: woodTex }),
  spring: std({ map: springTex }),
  dossun: std({ map: dossunTex }),
  fire: std({ color: 0xffa020, emissive: 0xff5a00, roughness: 0.4 }),
};

// Box geometry whose UVs tile once per 2 world units, so textures keep their scale on any size
function boxGeo(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    uv.setXY(k, uv.getX(k) * dims[f][0] / 2, uv.getY(k) * dims[f][1] / 2);
  }
  return g;
}

// ---------- Shared models ----------
const enemyGeo = {
  body: new THREE.SphereGeometry(0.6, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2),
  base: new THREE.CylinderGeometry(0.45, 0.5, 0.35, 16),
  eye: new THREE.SphereGeometry(0.11, 8, 6),
  pupil: new THREE.SphereGeometry(0.055, 8, 6),
  foot: new THREE.SphereGeometry(0.18, 8, 6),
  spot: new THREE.SphereGeometry(0.16, 8, 6),
};
const enemyMat = { cap: std({ color: 0xa0522d }), spot: std({ color: 0xfffaf0 }), base: std({ color: 0xf2d2a9 }), dark: std({ color: 0x1d2a44 }), foot: std({ color: 0x4a2a14 }) };
function makeEnemyMesh(capMat = enemyMat.cap) {
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  add(enemyGeo.base, enemyMat.base, 0, 0.4, 0);
  const cap = add(enemyGeo.body, capMat, 0, 0.5, 0); cap.scale.y = 1.1;
  [-0.18, 0.18].forEach(x => {
    add(enemyGeo.eye, enemyMat.spot, x, 0.45, 0.4).scale.y = 1.4;
    add(enemyGeo.pupil, enemyMat.dark, x, 0.45, 0.5).scale.y = 1.6;
  });
  g.userData.feet = [-0.22, 0.22].map(x => add(enemyGeo.foot, enemyMat.foot, x, 0.15, 0.05));
  return g;
}

function makeStar() {
  const star = new THREE.Group();
  const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1.0, a = Math.PI / 2 + i * Math.PI / 5;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? sh.lineTo(x, y) : sh.moveTo(x, y);
  }
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.3, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 2 });
  geo.center();
  const m = new THREE.Mesh(geo, std({ color: 0xffd23c, emissive: 0x996600, roughness: 0.35, metalness: 0.3 }));
  m.castShadow = true; star.add(m);
  const eyeM = std({ color: 0x1d2a44 });
  [-0.16, 0.16].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), eyeM); e.scale.y = 1.8; e.position.set(x, 0.05, 0.24); star.add(e); });
  star.add(new THREE.PointLight(0xffd23c, 1.2, 9));
  return star;
}

function makeHeart() {
  const sh = new THREE.Shape();
  sh.moveTo(0, -0.5);
  sh.bezierCurveTo(-0.9, 0.1, -0.5, 0.75, 0, 0.35);
  sh.bezierCurveTo(0.5, 0.75, 0.9, 0.1, 0, -0.5);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.22, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 2 });
  geo.center();
  const m = new THREE.Mesh(geo, std({ color: 0xff6b5a, emissive: 0x661010, roughness: 0.4 }));
  m.castShadow = true;
  return m;
}

// ---------- Hero ----------
function makeHero() {
  const g = new THREE.Group();
  const m = (c) => std({ color: c, roughness: 0.6 });
  const skin = m(0xffd2a6), cap = m(0x1fb5a8), shirt = m(0xffc93c), pants = m(0x2a3d8f), shoe = m(0x6b3b1f), white = m(0xffffff), dark = m(0x1d2a44);
  const add = (mesh, x, y, z, parent = g) => { mesh.position.set(x, y, z); mesh.castShadow = true; parent.add(mesh); return mesh; };
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.4, 0.5, 16), pants), 0, 0.58, 0);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.3, 16), shirt), 0, 0.96, 0);
  [-0.14, 0.14].forEach(x => add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), white), x, 0.78, 0.37));
  add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 16), skin), 0, 1.33, 0);
  add(new THREE.Mesh(new THREE.SphereGeometry(0.385, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), cap), 0, 1.4, 0);

function bossMove(spd, dir, dt) {
  boss.x += Math.sin(dir) * spd * dt; boss.z += Math.cos(dir) * spd * dt;
  return bossConstrain();

// Keep the boss on the arena and out of pillars; returns 'edge' | 'pillar' | null
function bossConstrain() {
  const A = level.arena, lim = A.half - BOSS_R;
  let hit = null;
  if (boss.x < A.x - lim) { boss.x = A.x - lim; hit = 'edge'; }
  if (boss.x > A.x + lim) { boss.x = A.x + lim; hit = 'edge'; }
  if (boss.z < A.z - lim) { boss.z = A.z - lim; hit = 'edge'; }
  if (boss.z > A.z + lim) { boss.z = A.z + lim; hit = 'edge'; }
  for (const s of solids) {
    if (!s.pillar) continue;
    const cx = Math.max(s.min.x, Math.min(boss.x, s.max.x)), cz = Math.max(s.min.z, Math.min(boss.z, s.max.z));
    const dx = boss.x - cx, dz = boss.z - cz, d = Math.hypot(dx, dz);
    if (d < BOSS_R) {
      const n = d > 0.001 ? [dx / d, dz / d] : [0, 1];
      boss.x = cx + n[0] * BOSS_R; boss.z = cz + n[1] * BOSS_R;

    }
  }
  return hit;
}
function turnToward(cur, target, k) {
  let d = target - cur; d = Math.atan2(Math.sin(d), Math.cos(d));
  return cur + d * Math.min(1, k);
}
function bossStartJump() {
  const A = level.arena, lim = A.half - BOSS_R;
  boss.from = [boss.x, boss.z];
  boss.to = [Math.max(A.x - lim, Math.min(A.x + lim, P.pos.x)), Math.max(A.z - lim, Math.min(A.z + lim, P.pos.z))];
  boss.jumpDur = boss.angry ? 0.8 : 1.05;
  boss.state = 'jump'; boss.t = boss.jumpDur;
  tone(160, 420, 0.3, 'triangle', 0.12);
}
function updateBoss(dt, t) {
  const b = boss; if (!b) return;
  const playing = G.state === 'play';
  const toP = Math.atan2(P.pos.x - b.x, P.pos.z - b.z);
  const angry = b.angry;
  b.t -= dt;
  let shakeBody = 0;
  switch (b.state) {
    case 'sleep': {
      const A = level.arena;
      if (playing && P.pos.z < A.z + A.half - 1 && P.pos.y > -0.5 && Math.abs(P.pos.x - A.x) < A.half) {
        b.state = 'intro'; b.y = 12; b.vy = 0; b.mesh.visible = true;
        bossBar.hidden = false; updateBossBar();
        toast('ボス：キングマッシュ', 2.2); sfx.roar();
      }
      break;
    }
    case 'intro':
      b.dir = turnToward(b.dir, toP, dt * 4);
      b.vy -= 40 * dt; b.y += b.vy * dt;
      if (b.y <= 0) { b.y = 0; cam.shake = 0.6; spawnWave(b.x, b.z); sfx.pound(); b.state = 'chase'; b.t = 1.6; }
      break;
    case 'chase':
      b.dir = turnToward(b.dir, toP, dt * 3);
      bossMove(angry ? 4 : 2.8, b.dir, dt);
      if (b.t <= 0) {
        b.cycle++;
        if (b.cycle % 2) { b.state = 'windup'; b.t = angry ? 0.45 : 0.75; tone(90, 70, 0.5, 'sawtooth', 0.08); }
        else { b.jumps = angry ? 3 : 2; bossStartJump(); }
      }
      break;
    case 'windup':
      b.dir = turnToward(b.dir, toP, dt * 10);
      shakeBody = 0.08;
      if (b.t <= 0) { b.cdir = b.dir; b.state = 'charge'; b.t = 1.7; tone(220, 110, 0.4, 'sawtooth', 0.1); }
      break;
    case 'charge': {
      const hit = bossMove(angry ? 21 : 16, b.cdir, dt);
      if (Math.random() < dt * 30) puff(new THREE.Vector3(b.x, 0.2, b.z), 0xc9b8c0, 1, 2);
      if (hit === 'pillar') {
        b.state = 'stunned'; b.t = angry ? 1.7 : 2.4; cam.shake = 0.5; sfx.pound();
        puff(new THREE.Vector3(b.x, 1.5, b.z), 0xffffff, 12, 5);
        toast('いまだ！ふみつけろ！', 1.2);
      } else if (hit === 'edge' || b.t <= 0) { b.state = 'recover'; b.t = 0.7; }
      break;
    }
    case 'recover':
      if (b.t <= 0) { b.state = 'chase'; b.t = angry ? 1.2 : 1.8; }
      break;
    case 'jump': {
      const u = Math.min(1, 1 - b.t / b.jumpDur);
      b.x = b.from[0] + (b.to[0] - b.from[0]) * u;
      b.z = b.from[1] + (b.to[1] - b.from[1]) * u;
      b.y = Math.sin(Math.PI * u) * 7;
      b.dir = turnToward(b.dir, toP, dt * 5);
      bossConstrain();
      if (u >= 1) {
        b.y = 0; cam.shake = 0.45; sfx.pound();
        spawnWave(b.x, b.z, angry ? 12 : 9.5);
        puff(new THREE.Vector3(b.x, 0.3, b.z), 0xc9b8c0, 10, 6);
        b.jumps--;
        if (b.jumps > 0) { b.state = 'pause'; b.t = angry ? 0.2 : 0.35; }
        else { b.state = 'dazed'; b.t = angry ? 0.9 : 1.3; }
      }
      break;
    }
    case 'pause':
      if (b.t <= 0) bossStartJump();
      break;
    case 'stunned':
    case 'dazed':
      if (b.t <= 0) { b.state = 'chase'; b.t = angry ? 1.0 : 1.6; }
      break;
    case 'hurt':
      b.x += b.kb[0] * dt; b.z += b.kb[1] * dt; b.kb[0] *= 0.92; b.kb[1] *= 0.92;
      bossConstrain();
      shakeBody = 0.06;
      if (b.t <= 0) {
        if (b.hp <= BOSS_HP / 2 && !b.angry) {
          b.angry = true; updateBossBar(); sfx.roar(); toast('キングマッシュが怒った！', 1.8);
          const A = level.arena;
          for (let i = 0; i < 2; i++) addEnemy(b.x + (i ? 2.5 : -2.5), 0, b.z + 1.5, [A.x - A.half + 1, A.x + A.half - 1, A.z - A.half + 1, A.z + A.half - 1], true);
        } else if (b.angry && b.hp <= 2 && enemies.filter(e => e.minion && e.alive).length < 2) {
          const A = level.arena;
          addEnemy(b.x, 0, b.z + 2.5, [A.x - A.half + 1, A.x + A.half - 1, A.z - A.half + 1, A.z + A.half - 1], true);
        }
        b.state = 'chase'; b.t = angry ? 0.9 : 1.4;
      }
      break;
    case 'dying':
      b.mesh.rotation.y += dt * 12;
      b.mesh.scale.setScalar(Math.max(0.01, b.t / 2.2));
      if (Math.random() < dt * 12) puff(new THREE.Vector3(b.x, 1.5, b.z), 0xffffff, 3, 4);
      if (b.t <= 0) {
        b.state = 'dead'; b.mesh.visible = false; bossBar.hidden = true;
        star.visible = true; star.position.set(b.x, 1.8, b.z); star.userData.baseY = 1.8;
        puff(star.position, 0xffd23c, 20, 6); sfx.check(); toast('スターがあらわれた！', 2);
      }
      return;
    default:
      return;
  }
  if (!b.mesh.visible) return;

  // Visuals
  b.mesh.position.set(b.x, b.y, b.z);
  b.mesh.rotation.y = b.dir;
  const vul = bossVulnerable();
  const sk = b.spikes.scale.y + ((vul ? 0.05 : 1) - b.spikes.scale.y) * Math.min(1, dt * 10);
  b.spikes.scale.set(1, sk, 1); b.spikes.visible = sk > 0.08;
  b.dizzy.visible = vul; b.dizzy.rotation.y += dt * 6;
  b.body.position.x = shakeBody ? (Math.random() - 0.5) * shakeBody * 4 : 0;
  b.body.rotation.z = vul ? Math.sin(t * 6) * 0.15 : 0;
  b.body.rotation.x = b.state === 'charge' ? 0.25 : 0;
  const walk = b.state === 'chase' || b.state === 'charge';
  const wob = walk ? Math.sin(t * (b.state === 'charge' ? 22 : 9)) : 0;
  b.feet[0].position.z = 0.2 + wob * 0.35; b.feet[1].position.z = 0.2 - wob * 0.35;
  b.body.traverse(o => { if (o.isMesh && o.material === bossMat.cap) o.material.emissive.setHex(b.state === 'hurt' && Math.floor(t * 20) % 2 ? 0x882222 : (b.angry ? 0x330000 : 0)); });

  // Contact with the hero
  if (!playing || b.state === 'hurt' || b.state === 'intro' && b.y > 2) return;
  const dx = P.pos.x - b.x, dz = P.pos.z - b.z, dist = Math.hypot(dx, dz);
  if (dist < BOSS_R + R && P.pos.y < b.y + BOSS_H && P.pos.y + H > b.y) {
    const onHead = P.vel.y < 0 && P.pos.y > b.y + BOSS_H * 0.6;
    if (onHead && vul) {
      damageBoss(P.pound === 'fall' ? 2 : 1);
      P.pound = null; P.vel.y = 16; P.cut = true; P.combo = 0;
      P.vel.x = Math.sin(toP) * 6; P.vel.z = Math.cos(toP) * 6;
    } else {
      if (dist > 0.01) { P.pos.x = b.x + dx / dist * (BOSS_R + R + 0.02); P.pos.z = b.z + dz / dist * (BOSS_R + R + 0.02); }
      hurt(new THREE.Vector3(b.x, 0, b.z));
      if (onHead) { P.vel.y = 12; toast('トゲが痛い！', 1); }
    }
  }
}

const puffGeo = new THREE.SphereGeometry(0.18, 8, 6);
function puff(pos, color = 0xffffff, n = 8, spd = 3) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.copy(pos);
    const a = Math.random() * Math.PI * 2;
    particles.push({ m, v: new THREE.Vector3(Math.cos(a) * spd, 1 + Math.random() * 2, Math.sin(a) * spd), life: 0.5 });
    scene.add(m);
  }
}

function tone(f0, f1, dur, type = 'square', vol = 0.08, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}

function hitQ(s) {

  s.bump = 0.2; sfx.block();

  s.type = 'used'; s.mesh.material = MAT.used;
  const c = put(new THREE.Mesh(coinGeo, coinMat)); c.position.set(s.mesh.position.x, s.max.y + 0.4, s.mesh.position.z);
  pops.push({ m: c, t: 0 });
  addCoin();
}
function land(s, fallSpeed) {
  if (s.type === 'spring') {
    P.vel.y = 25; P.grounded = false; P.ground = null; P.pound = null; P.combo = 0; P.flip = 1;
    sfx.spring(); hero.scale.set(1.25, 0.7, 1.25); return;
  }
  const wasAir = !P.grounded;
  P.vel.y = 0; P.grounded = true; P.ground = s;
  if (!wasAir) return;
  if (P.pound) {
    P.pound = null; cam.shake = 0.3; sfx.pound();
    puff(P.pos, 0xfff1d6, 14, 6);
    enemies.forEach(e => { if (e.alive && Math.hypot(e.mesh.position.x - P.pos.x, e.mesh.position.z - P.pos.z) < 3 && Math.abs(e.y - P.pos.y) < 1.5) killEnemy(e); });
  } else if (fallSpeed > 12) puff(P.pos, 0xfff1d6, 5, 2);
  hero.scale.set(1.2, 0.8, 1.2);
  P.comboWindow = 0.22; P.flip = 0;
}
function killEnemy(e) {
  e.alive = false; e.deadT = 0.5; sfx.stomp();
  e.mesh.scale.set(1.4, 0.25, 1.4);
  puff(e.mesh.position.clone().setY(e.y + 0.3), 0xffffff, 8, 3);
}

function step(dt, t) {
  // Moving platforms
  solids.forEach(s => {
    if (!s.move) return;
    const prev = s.mesh.position.clone();
    s.mesh.position.copy(s.base);
    s.mesh.position[s.move.axis] += s.move.amp * Math.sin(t * s.move.speed + s.move.phase);
    s.delta.subVectors(s.mesh.position, prev);
    updateBounds(s);
  });
  qBlocks.forEach(b => { if (b.bump > 0) { b.bump = Math.max(0, b.bump - dt); b.mesh.position.y = b.base.y + Math.sin((0.2 - b.bump) / 0.2 * Math.PI) * 0.35; } });

  const playing = G.state === 'play';
  let ix = 0, iz = 0;
  if (playing) {
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iz += 1;
    if (keys.KeyS || keys.ArrowDown) iz -= 1;
    ix += joy.x; iz -= joy.y;
  }
  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
  if (keys.KeyQ) cam.yaw += dt * 2.2;
  if (keys.KeyE) cam.yaw -= dt * 2.2;
  const jumpDown = playing && !!(keys.Space || keys.KeyJ || keys.KeyZ || touchBtn.a);
  const poundDown = playing && !!(keys.ShiftLeft || keys.ShiftRight || keys.KeyK || keys.KeyX || touchBtn.b);
  const jumpPressed = jumpDown && !jumpWasDown, poundPressed = poundDown && !poundWasDown;
  jumpWasDown = jumpDown; poundWasDown = poundDown;

  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const wx = fx * iz + rx * ix, wz = fz * iz + rz * ix;
  const inMag = Math.hypot(wx, wz);

  if (P.ground && P.ground.move) P.pos.add(P.ground.delta);

  if (P.pound === 'hang') {
    P.poundT -= dt; P.vel.set(0, 0, 0);
    if (P.poundT <= 0) { P.pound = 'fall'; P.vel.y = -34; }
  } else if (P.pound !== 'fall') {
    const accel = P.grounded ? 70 : 32;
    const tx = wx * MAX_SPD, tz = wz * MAX_SPD;
    const dx = tx - P.vel.x, dz = tz - P.vel.z, dl = Math.hypot(dx, dz), mx = accel * dt;
    if (dl <= mx) { P.vel.x = tx; P.vel.z = tz; } else { P.vel.x += dx / dl * mx; P.vel.z += dz / dl * mx; }
    P.vel.y -= GRAV * dt * (P.vel.y < 0 ? 1.25 : 1);
    if (P.vel.y < -40) P.vel.y = -40;
  }
  if (inMag > 0.15 && !P.pound) P.facing = turnToward(P.facing, Math.atan2(wx, wz), dt * 14);

  // Jump (coyote time, buffering, triple-jump combo)
  P.coyote = P.grounded ? 0.1 : Math.max(0, P.coyote - dt);
  P.buffer = jumpPressed ? 0.12 : Math.max(0, P.buffer - dt);
  if (P.grounded) { P.comboWindow -= dt; if (P.comboWindow < 0) P.combo = 0; }
  if (P.buffer > 0 && P.coyote > 0 && !P.pound) {
    const speed = Math.hypot(P.vel.x, P.vel.z);
    P.combo = (P.comboWindow > 0 && speed > 4) ? Math.min(P.combo + 1, 2) : 0;
    P.vel.y = JUMPS[P.combo];
    P.grounded = false; P.ground = null; P.coyote = 0; P.buffer = 0; P.cut = false;
    P.flip = P.combo === 2 ? 1 : 0;
    sfx.jump(P.combo); hero.scale.set(0.8, 1.25, 0.8);
  }
  if (!jumpDown && P.vel.y > 0 && !P.cut && !P.grounded && P.flip === 0) { P.vel.y *= 0.5; P.cut = true; }
  if (poundPressed && !P.grounded && !P.pound) { P.pound = 'hang'; P.poundT = 0.2; P.flip = 0; tone(600, 300, 0.15, 'triangle', 0.08); }

  // Integrate & collide, one axis at a time
  for (const ax of ['x', 'z']) {
    P.pos[ax] += P.vel[ax] * dt;
    for (const s of solids) {
      if (!hits(P.pos.x, P.pos.y, P.pos.z, s)) continue;
      if (P.pos.y > s.max.y - 0.06 || P.pos.y + H < s.min.y + 0.06) continue;
      const lo = (P.pos[ax] + R) - s.min[ax], hi = s.max[ax] - (P.pos[ax] - R);
      P.pos[ax] += lo < hi ? -lo : hi;
      P.vel[ax] = 0;
    }
  }
  const fallSpeed = -P.vel.y;
  P.pos.y += P.vel.y * dt;
  const wasGrounded = P.grounded;
  P.grounded = false;
  let landed = null;
  for (const s of solids) {
    if (!hits(P.pos.x, P.pos.y, P.pos.z, s)) continue;
    if (P.vel.y <= 0) { P.pos.y = s.max.y; landed = s; }
    else { P.pos.y = s.min.y - H; P.vel.y = 0; P.cut = true; hitQ(s); }
  }
  if (landed) { P.grounded = wasGrounded; land(landed, fallSpeed); }
  else P.ground = null;

  if (P.pos.y < level.killY && G.state === 'play') { puff(P.pos.clone().setY(level.killY - 0.5), level.id === '1-2' ? 0xff7a30 : 0xffffff, 12, 4); loseLife(); }

  const cx = P.pos.x, cy = P.pos.y + 0.75, cz = P.pos.z;

  // Enemies
  enemies.forEach(e => {
    const m = e.mesh;
    if (!e.alive) {
      e.deadT -= dt; if (e.deadT <= 0 && m.parent) world.remove(m);
      return;
    }
    const dx = P.pos.x - m.position.x, dz = P.pos.z - m.position.z, dist = Math.hypot(dx, dz);
    const near = playing && dist < 7 && Math.abs(P.pos.y - e.y) < 2.5;
    let spd = e.minion ? 2.2 : 1.6;
    if (near) { e.dir = Math.atan2(dx, dz); spd = e.minion ? 4 : 3.3; }
    else { e.turnT -= dt; if (e.turnT <= 0) { e.dir += (Math.random() - 0.5) * 2.5; e.turnT = 1.5 + Math.random() * 2; } }
    let nx = m.position.x + Math.sin(e.dir) * spd * dt, nz = m.position.z + Math.cos(e.dir) * spd * dt;
    const [x0, x1, z0, z1] = e.b;
    if (nx < x0 || nx > x1 || nz < z0 || nz > z1) {
      nx = Math.min(x1, Math.max(x0, nx)); nz = Math.min(z1, Math.max(z0, nz));
      if (!near) e.dir += Math.PI;
    }
    m.position.set(nx, e.y, nz);
    m.rotation.y = turnToward(m.rotation.y, e.dir, dt * 8);
    const wob = Math.sin(t * (near ? 16 : 9) + e.seed);
    m.userData.feet[0].position.z = 0.05 + wob * 0.15; m.userData.feet[1].position.z = 0.05 - wob * 0.15;
    m.rotation.z = wob * 0.06;
    if (!playing) return;
    if (dist < R + 0.55 && P.pos.y < e.y + 1.1 && P.pos.y + H > e.y) {
      if ((P.vel.y < 0 && P.pos.y > e.y + 0.45) || P.pound === 'fall') {
        killEnemy(e);
        if (P.pound !== 'fall') { P.vel.y = jumpDown ? 17 : 11; P.cut = !jumpDown; P.combo = 0; }
      } else hurt(m.position);
    }
  });

  // Firebars
  firebars.forEach(f => {
    f.a += f.speed * dt; f.grp.rotation.y = f.a;
    if (!playing) return;
    for (let i = 1; i <= f.len; i++) {
      const px = f.x + Math.cos(f.a) * i * 0.55, pz = f.z - Math.sin(f.a) * i * 0.55;
      const dy = Math.max(P.pos.y + 0.3, Math.min(f.y, P.pos.y + H - 0.3)) - f.y;
      if ((px - P.pos.x) ** 2 + (pz - P.pos.z) ** 2 + dy * dy < (R + 0.28) ** 2) { hurt(new THREE.Vector3(px, 0, pz)); break; }
    }
  });

  // Crushers (Dossun)
  dossuns.forEach(d => {
    const under = Math.abs(P.pos.x - d.x) < 1.9 && Math.abs(P.pos.z - d.z) < 2.6 && P.pos.y < d.y;
    switch (d.state) {
      case 'idle': d.t -= dt; if (playing && under && d.t <= 0) { d.state = 'fall'; d.vy = 0; } break;
      case 'fall':
        d.vy -= 60 * dt; d.y += d.vy * dt;
        if (d.y <= d.groundY) { d.y = d.groundY; d.state = 'wait'; d.t = 1.1; tone(110, 40, 0.3, 'triangle', 0.25); puff(new THREE.Vector3(d.x, d.groundY + 0.2, d.z), 0xc9b8c0, 10, 4); if (Math.hypot(P.pos.x - d.x, P.pos.z - d.z) < 10) cam.shake = 0.25; }
        break;
      case 'wait': d.t -= dt; if (d.t <= 0) d.state = 'rise'; break;
      case 'rise': d.y += 3 * dt; if (d.y >= d.topY) { d.y = d.topY; d.state = 'idle'; d.t = 0.5; } break;
    }
    d.mesh.position.set(d.x, d.y + 1.1, d.z);
    if (playing && d.state !== 'idle' &&
      Math.abs(P.pos.x - d.x) < 1.1 + R && Math.abs(P.pos.z - d.z) < 1.1 + R && P.pos.y < d.y + 2.2 && P.pos.y + H > d.y) {
      hurt(new THREE.Vector3(d.x, 0, d.z + (P.pos.z > d.z ? -1 : 1)));
    }
  });

  updateBoss(dt, t);

  // Boss shockwaves: jump over them or stand on a pillar
  waves = waves.filter(w => {
    w.r += w.speed * dt;
    w.mesh.scale.set(w.r, 1, w.r);
    w.mesh.material.opacity = Math.max(0, 0.85 * (1 - w.r / 16));
    if (playing && P.pos.y < 0.6 && Math.abs(Math.hypot(P.pos.x - w.x, P.pos.z - w.z) - w.r) < 0.55) hurt(new THREE.Vector3(w.x, 0, w.z));
    if (w.r > 16) { world.remove(w.mesh); return false; }
    return true;
  });

  // Coins and pickups
  coins.forEach(c => {
    if (!c.parent) return;
    c.rotation.y += dt * 3;
    if (playing && (c.position.x - cx) ** 2 + (c.position.y - cy) ** 2 + (c.position.z - cz) ** 2 < 1.25) {
      world.remove(c); addCoin(); puff(c.position, 0xffe27a, 5, 2);
    }
  });
  pickups.forEach(p => {
    if (!p.m.parent) return;
    p.m.rotation.y += dt * 2.5; p.m.position.y = p.base + Math.sin(t * 3) * 0.15;
    if (playing && (p.m.position.x - cx) ** 2 + (p.m.position.y - cy) ** 2 + (p.m.position.z - cz) ** 2 < 1.5) {
      world.remove(p.m); P.hp = 3; updateHUD(); sfx.heal(); toast('体力回復！', 1.2); puff(p.m.position, 0xff6b5a, 8, 2);
    }
  });
  pops = pops.filter(p => {
    p.t += dt; p.m.position.y += (6 - p.t * 14) * dt; p.m.rotation.y += dt * 15;
    if (p.t > 0.55) { world.remove(p.m); puff(p.m.position, 0xffe27a, 4, 2); return false; }
    return true;
  });

  // Checkpoints
  flags.forEach(f => {
    if (!playing || f.on) return;
    const fp = f.g.position;
    if (Math.hypot(P.pos.x - fp.x, P.pos.z - fp.z) < 1.4 && Math.abs(P.pos.y - fp.y) < 2) {
      flags.forEach(o => { if (o !== f && o.on) o.cloth.material.color.set(0xff6b5a); });
      f.on = true; G.respawn.set(fp.x + 1.5, fp.y, fp.z);
      f.cloth.material.color.set(0x3fa34d); sfx.check(); toast('チェックポイント！');
    }
  });
  // Star
  if (star && star.visible) {
    star.rotation.y += dt * 2; star.position.y = star.userData.baseY + Math.sin(t * 2) * 0.25;
    if (playing && star.position.distanceTo(new THREE.Vector3(cx, cy, cz)) < 1.6) starGet();
  }

  // Timers
  if (playing) { G.time += dt; hud.time.textContent = fmtTime(G.time); }
  if (P.invuln > 0) P.invuln -= dt;
  if (G.state === 'dying') { G.deadT -= dt; hero.visible = false; if (G.deadT <= 0) { G.state = 'play'; respawn(); } }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.add('off'); }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.material.opacity = Math.max(0, p.life * 2); p.m.scale.setScalar(0.5 + p.life * 1.5);
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); particles.splice(i, 1); }
  }
  if (level.id === '1-1') skyClouds.forEach((c, i) => { c.position.x += dt * (0.6 + (i % 3) * 0.3); if (c.position.x > 100) c.position.x = -100; });
  else {
    skyClouds.forEach((c, i) => { c.position.y += dt * (0.8 + (i % 4) * 0.3); if (c.position.y > 16) c.position.y = -6; });
    if (level.lava) level.lava.material.emissive.setHSL(0.04, 1, 0.33 + Math.sin(t * 1.5) * 0.04);
  }
}

// ---------- Hero animation, shadow, camera ----------
const ONE = new THREE.Vector3(1, 1, 1);
function animate(dt, t) {
  heroRoot.position.copy(P.pos);
  heroRoot.rotation.y = P.facing;
  if (G.state !== 'dying') hero.visible = P.invuln > 0 && G.state === 'play' ? Math.floor(t * 20) % 2 === 0 : true;
  hero.scale.lerp(ONE, Math.min(1, dt * 12));
  const L = hero.userData.limbs;
  const speed = Math.hypot(P.vel.x, P.vel.z);
  if (P.pound) {
    hero.rotation.x = P.pound === 'hang' ? hero.rotation.x + dt * 30 : 0;
    L.legL.rotation.x = L.legR.rotation.x = -1.2; L.armL.rotation.z = 0.4; L.armR.rotation.z = -0.4;
  } else if (!P.grounded) {
    hero.rotation.x = P.flip ? hero.rotation.x + dt * 13 : hero.rotation.x * 0.8;
    if (P.flip && hero.rotation.x > Math.PI * 2) { P.flip = 0; hero.rotation.x = 0; }
    L.legL.rotation.x = -0.9; L.legR.rotation.x = 0.4;
    L.armL.rotation.x = -2.6; L.armR.rotation.x = 0.4; L.armL.rotation.z = 0.2; L.armR.rotation.z = -0.2;
    hero.position.y = 0;
  } else {
    hero.rotation.x = 0;
    P.walk += dt * speed * 1.6;
    const k = Math.min(1, speed / MAX_SPD), s = Math.sin(P.walk);
    L.legL.rotation.x = s * 0.9 * k; L.legR.rotation.x = -s * 0.9 * k;
    L.armL.rotation.x = -s * 0.8 * k; L.armR.rotation.x = s * 0.8 * k;
    L.armL.rotation.z = 0.1; L.armR.rotation.z = -0.1;
    hero.position.y = Math.abs(Math.cos(P.walk)) * 0.08 * k;
  }
  hero.rotation.x = hero.rotation.x % (Math.PI * 2);

  // Blob shadow onto the highest surface below
  let top = level.killY - 1;
  for (const s of solids) {
    if (P.pos.x > s.min.x && P.pos.x < s.max.x && P.pos.z > s.min.z && P.pos.z < s.max.z && s.max.y <= P.pos.y + 0.05 && s.max.y > top) top = s.max.y;
  }
  blob.position.set(P.pos.x, top + 0.04, P.pos.z);
  const hgt = P.pos.y - top;
  blob.scale.setScalar(Math.max(0.35, 1 - hgt * 0.05));
  blob.material.opacity = Math.max(0.12, 0.38 - hgt * 0.02);
  blob.visible = G.state !== 'dying';

  // Camera: pull back during the boss fight
  const fighting = boss && boss.mesh.visible && boss.state !== 'dead';
  cam.extra += ((fighting ? 4 : 0) - cam.extra) * Math.min(1, dt * 2);
  const goal = P.pos.clone(); goal.y += 1.4;
  cam.target.lerp(goal, 1 - Math.exp(-dt * 7));
  const dist = cam.dist + cam.extra, cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * cp * dist,
    cam.target.y + Math.sin(cam.pitch) * dist,
    cam.target.z + Math.cos(cam.yaw) * cp * dist);
  if (cam.shake > 0) {
    cam.shake -= dt;
    camera.position.x += (Math.random() - 0.5) * cam.shake * 1.5;
    camera.position.y += (Math.random() - 0.5) * cam.shake * 1.5;
  }
  camera.lookAt(cam.target);
  sun.position.set(P.pos.x + 12, P.pos.y + 30, P.pos.z + 8);
  sun.target.position.copy(P.pos);
}

// ---------- Loop ----------
let last = performance.now(), clock = 0;
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now; clock += dt;
  if (G.state === 'title') cam.yaw += dt * 0.15;
  step(dt, clock);
  animate(dt, clock);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Enter' || overlay.hidden) return;
  const b = card.querySelector('.btn:not(:disabled)'); if (b && document.activeElement === document.body) b.click();
});
if (location.hash === '#debug') window.__coco = { P, G, get boss() { return boss; }, startStage };
showTitle();
requestAnimationFrame(frame);
})();
</script>
